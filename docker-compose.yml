version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ventureos_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ventureos:ventureos_secret@postgres:5432/ventureos_db?schema=public
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: ventureos_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ventureos
      POSTGRES_PASSWORD: ventureos_secret
      POSTGRES_DB: ventureos_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
